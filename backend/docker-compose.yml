version: "3.9"

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 4 --timeout 60"
    # Source is baked into the image; mount ".:/app" only in local dev.
    ports:
      # Bound to localhost: put HTTPS (Caddy) in front. Use "8000:8000" only for LAN testing.
      - "127.0.0.1:8000:8000"
    environment:
      USE_REDIS_CACHE: "true"
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the web service reaches Postgres.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No published port: Redis has no password and must stay internal.
    restart: unless-stopped
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ../frontend
      args:
        # nginx in the frontend image proxies /api/ to the web service: same origin, no CORS.
        VITE_API_BASE_URL: /api/
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
